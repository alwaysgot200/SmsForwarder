//获取 commit ID
def getGitCommitId() {
    try {
        def proc = ['git', 'rev-parse', '--short', 'HEAD'].execute(null, rootDir)
        proc.waitFor()
        return proc.exitValue() == 0
                ? proc.text.trim()
                : "unknown"
    } catch (Throwable ignore) {
        return "unknown"
    }
}
