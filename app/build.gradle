//file:noinspection DependencyNotationArgument
import groovy.json.JsonBuilder
import groovy.json.JsonSlurper

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize'
    //AspectJ 后编译织入（AGP 8 适配）：织入 XAOP 的 @SingleClick 等二进制切面
    //https://github.com/freefair/android-gradle-plugins
    id "io.freefair.android.aspectj.post-compile-weaving" version "8.13.0"
}

def keyProps = new Properties()
def keyPropsFile = rootProject.file('keystore/keystore.properties')
if (keyPropsFile.exists()) {
    keyProps.load(new FileInputStream(keyPropsFile))
}

//CI tag 发布时（Release.yml 传 -PtagVersion）以 git tag 为版本唯一事实来源：
//versionName 直接取 tag，versionCode 由 X.Y.Z 推导为 X*100000+Y*1000+Z（单调递增，
//保证旧版可升级并触发 XUpdate 更新）；非 tag 构建仍用 versions.gradle 的值。
//非 X.Y.Z 格式（如 workflow_dispatch 触发时传入分支名）自动回退
def tagVersion = (findProperty('tagVersion') ?: '').toString()
if (!(tagVersion ==~ /^\d+\.\d+\.\d+$/)) {
    tagVersion = ''
}
def releaseVersionName = tagVersion ?: build_versions.version_name
def releaseVersionCode = build_versions.version_code
if (tagVersion) {
    def v = tagVersion.split('\\.')*.toInteger()
    releaseVersionCode = v[0] * 100000 + v[1] * 1000 + v[2]
}

//打包时，记得设置true启用
if (isNeedPackage.toBoolean() && isUseBooster.toBoolean()) {
    apply plugin: 'com.didiglobal.booster'
}

// 禁止 Java 编译器显示过时 API 警告
gradle.projectsEvaluated {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:-removal"
    }
}

android {
    buildToolsVersion build_versions.build_tools
    //compileSdk 35（Room 2.6.1 要求 ≥34），targetSdk 仍是 build_versions.target_sdk
    compileSdkVersion build_versions.compile_sdk

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    //Kotlin 与 Java 编译目标保持一致（KGP 1.9+ 强校验）
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        //AGP 8 默认不再生成 BuildConfig，需显式开启（代码使用 BUILD_TIME 等字段）
        buildConfig true
    }

    //编译日期
    def buildDate = new Date().format("yyMMdd", TimeZone.getTimeZone("GMT+08"))
    //编译时间
    def buildTime = new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("GMT+08"))
    //Git 的 Commit ID
    def gitCommitId = getGitCommitId()

    defaultConfig {
        applicationId "cn.ppps.forwarder"
        minSdkVersion build_versions.min_sdk
        targetSdkVersion build_versions.target_sdk
        versionCode releaseVersionCode
        versionName = "${releaseVersionName}.${buildDate}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BUILD_TIME", "\"${buildTime}\""
        buildConfigField "String", "GIT_COMMIT_ID", "\"${gitCommitId}\""

        multiDexEnabled true
        //vectorDrawables.useSupportLibrary = true

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [moduleName: project.getName()]
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            keyAlias keyProps['keyAlias']
            keyPassword keyProps['keyPassword']
            storeFile keyProps['storeFile'] ? file(keyProps['storeFile']) : null
            storePassword keyProps['storePassword']
        }
        //仅当本地存在 keystore/keystore.properties 时才覆盖内置 debug 签名配置，
        //否则保留 AGP 默认调试签名（~/.android/debug.keystore），无密钥也能本地出包
        if (keyPropsFile.exists()) {
            debug {
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
                storeFile keyProps['storeFile'] ? file(keyProps['storeFile']) : null
                storePassword keyProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // 调试模式开关
            debuggable false
            jniDebuggable false
            // 移除无用的资源
            shrinkResources true
            // 代码混淆开关
            minifyEnabled true
            // 混淆配置
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (isNeedPackage.toBoolean()) {
                signingConfig signingConfigs.release
                if (file('local.properties').exists()) {
                    Properties properties = new Properties()
                    properties.load(project.rootProject.file('local.properties').newDataInputStream())
                    def appID = properties.getProperty("APP_ID_UMENG")
                    if (appID != null) {
                        buildConfigField "String", "APP_ID_UMENG", appID
                    } else {
                        buildConfigField "String", "APP_ID_UMENG", '"60254fc7425ec25f10f4293e"'
                    }
                } else {
                    buildConfigField "String", "APP_ID_UMENG", '"60254fc7425ec25f10f4293e"'
                }
            } else {
                signingConfig signingConfigs.debug
                buildConfigField "String", "APP_ID_UMENG", '"60254fc7425ec25f10f4293e"'
            }

            // 屏蔽 R8 stack map warning
            buildConfigField "boolean", "DISABLE_R8_WARNINGS", "true"
        }
        debug {
            // 调试模式开关
            debuggable true
            jniDebuggable true
            // Debug 构建不执行资源压缩和代码混淆，避免不必要的资源中间产物重建。
            shrinkResources false
            minifyEnabled false
            // 混淆配置
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (isNeedPackage.toBoolean()) {
                signingConfig signingConfigs.release
                if (file('local.properties').exists()) {
                    Properties properties = new Properties()
                    properties.load(project.rootProject.file('local.properties').newDataInputStream())
                    def appID = properties.getProperty("APP_ID_UMENG")
                    if (appID != null) {
                        buildConfigField "String", "APP_ID_UMENG", appID
                    } else {
                        buildConfigField "String", "APP_ID_UMENG", '"60254fc7425ec25f10f4293e"'
                    }
                } else {
                    buildConfigField "String", "APP_ID_UMENG", '"60254fc7425ec25f10f4293e"'
                }
            } else {
                signingConfig signingConfigs.debug
                buildConfigField "String", "APP_ID_UMENG", '"60254fc7425ec25f10f4293e"'
            }

            // 屏蔽 R8 stack map warning
            buildConfigField "boolean", "DISABLE_R8_WARNINGS", "true"
        }
    }

    //ABI配置——按CPU架构分别打包
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }
    def abiCodes = ['universal': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'x86': 4, 'x86_64': 5]
    //AGP 8：packagingOptions 更名为 packaging，lib/** 排除移入 jniLibs 精确生效
    packaging {
        jniLibs {
            //去除FrpcLib的so，用时下载并动态加载
            if (excludeFrpclib.toBoolean()) {
                excludes += ['lib/armeabi-v7a/libgojni.so', 'lib/arm64-v8a/libgojni.so', 'lib/x86/libgojni.so', 'lib/x86_64/libgojni.so']
            }
            excludes += ["kotlin/**"]
        }
        resources {
            merge 'META-INF/mailcap'
            pickFirst 'META-INF/LICENSE.md'
            pickFirst 'META-INF/NOTICE.md'
            excludes += ['META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/DEPENDENCIES', 'META-INF/notice.txt', 'META-INF/license.txt', 'META-INF/dependencies.txt', 'META-INF/LGPL2.1']
            excludes += ["META-INF/*.kotlin_module", "META-INF/*.version", "kotlin/**", "DebugProbesKt.bin"]
        }
    }

    android.applicationVariants.configureEach { variant ->
        variant.outputs.each { output ->
            //noinspection GrDeprecatedAPIUsage
            def abiName = output.getFilter(com.android.build.OutputFile.ABI)
            if (abiName == null) abiName = "universal"
            output.versionCodeOverride = abiCodes.get(abiName, 0) * 100000 + variant.versionCode
            output.outputFileName = "SmsForwarder_${releaseVersionName}_${abiName}.apk"

            // 修改 output-metadata.json 追加编译日期、编译时间、Git Commit ID
            def assembleTaskName = "assemble${variant.name.capitalize()}"
            tasks.named(assembleTaskName) {
                doLast {
                    def metadataFile = file("${output.outputFile.parent}/output-metadata.json")
                    def metadata = new JsonSlurper().parseText(metadataFile.text)
                    metadata.buildDate = buildDate
                    metadata.buildTime = buildTime
                    metadata.gitCommitId = gitCommitId
                    metadataFile.text = new JsonBuilder(metadata).toPrettyString()
                }
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    lint {
        abortOnError false
    }
    namespace 'cn.ppps.forwarder'

}

/**
 * ================================
 * XAOP 切面织入（@SingleClick / @MemoryCache 等）
 * 由 io.freefair.android.aspectj.post-compile-weaving 以 ajc 后编译织入。
 * xaop-runtime 仅发布 AAR，而 ajc 的 aspectpath 只接受 jar，
 * 故从 AAR 中提取 classes.jar（二进制切面）作为切面路径。
 * ================================
 */
configurations {
    xaopAspectAar
    //ajc 编译器工具链（详见下方 AjcWeave 的 aspectjClasspath 说明）
    ajcTool
}

dependencies {
    xaopAspectAar deps.xlibrary.xaop_runtime
}

def xaopAspectJar = layout.buildDirectory.file('aspectj/xaop-runtime-classes.jar')
def extractXaopAspect = tasks.register('extractXaopAspect') {
    inputs.files(configurations.xaopAspectAar)
    outputs.file(xaopAspectJar)
    doLast {
        def out = xaopAspectJar.get().asFile
        out.parentFile.mkdirs()
        //配置含 xaop-runtime 及其传递依赖，只取目标 AAR
        def aar = configurations.xaopAspectAar.files.find { it.name.startsWith('xaop-runtime') }
        def zip = new java.util.zip.ZipFile(aar)
        try {
            out.bytes = zip.getInputStream(zip.getEntry('classes.jar')).bytes
        } finally {
            zip.close()
        }
    }
}

dependencies {
    //XAOP 织入产物的运行时依赖（JoinPoint/AroundClosure 等 API）：
    //旧 xaop-plugin 构建时自动注入 aspectjrt 1.8.9，移除插件后在此显式声明（功能无损）。
    //org.aspectj.lang API 与 1.8.9 完全兼容，1.9.21+ 支持在 JDK 21 上运行 ajc
    implementation 'org.aspectj:aspectjrt:1.9.22.1'
    //ajc 编译器（仅构建期，不进 APK）
    ajcTool 'org.aspectj:aspectjtools:1.9.22.1'
    aspect files(xaopAspectJar) { builtBy extractXaopAspect }
}

//确保切面提取先于各变体的织入任务执行
tasks.matching { it.name.endsWith('AjcWeave') }.configureEach {
    dependsOn extractXaopAspect
    //AjcWeave 继承自 JavaCompile 但只用 outjar 输出，补一个 convention 值，
    //避免 kapt 等下游任务查询 classpath 元数据时报 "destinationDirectory has no value"
    destinationDirectory.set(layout.buildDirectory.dir("intermediates/ajc/${name}"))
    doFirst {
        //ajc 解析 android.* 类型需要 android.jar（AGP 只把它挂在 javac 的 bootclasspath，
        //织入任务拿不到，导致 can't find type android.view.View 等错误）。
        //配置期 classpath 尚未就绪（由变体配置稍后填充），故在执行前补入
        classpath += files("${project.android.sdkDirectory}/platforms/android-${build_versions.compile_sdk}/android.jar")
    }
    //显式指定 ajc 编译器（setFrom 覆盖插件的自动推断）：
    //插件在配置期从 classpath 文件名推断 aspectjtools，但此时变体 classpath 尚未填充
    //（且 enableJetifier 会把构件改名为 jetified-* 破坏文件名匹配），推断必然失败，故直接给出
    aspectjClasspath.setFrom(configurations.ajcTool)
}

