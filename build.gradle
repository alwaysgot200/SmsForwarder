//file:noinspection DependencyNotationArgument

buildscript {
    apply from: './versions.gradle'
    addRepos(repositories) //增加代码仓库
    dependencies {
        classpath deps.android_gradle_plugin
        classpath deps.android_maven_gradle_plugin
        //图片压缩
        classpath 'com.chenenyu:img-optimizer:1.3.0'
        //美团多渠道打包
        //classpath 'com.meituan.android.walle:plugin:1.1.6'
        //滴滴的质量优化框架
        if (isNeedPackage.toBoolean() && isUseBooster.toBoolean()) {
            classpath deps.booster.gradle_plugin
            classpath deps.booster.task_processed_res
            classpath deps.booster.task_resource_deredundancy
        }
        //AndServer
        classpath 'cn.ppps.andserver:plugin:2.1.12'
    }
}

allprojects {
    // 依赖仓库按构建环境自适应（本地国内网络与 CI 海外构建机处境相反）：
    // - CI（GitHub Actions，直连官方源稳定）：google/mavenCentral/jitpack 优先，避免去撞偶发 502 的 aliyun-central；
    //   aliyun-public 仅作 jcenter 停源库（broccoli 等）兜底，勿删。
    // - 本地（国内，直连 google/mavenCentral 被墙/极慢）：aliyun 镜像加速，jitpack 提供 com.github.* 独有库。
    repositories {
        if (System.getenv("CI")) {
            google()
            mavenCentral()
            maven { url "https://jitpack.io" }
            maven { url 'https://maven.aliyun.com/repository/public' }
        } else {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/central' }
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url "https://jitpack.io" }
        }
    }

}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
    delete subprojects.collect { it.buildDir }
}