name: CI

# topway 分支的构建验证：push / PR 均跑一次完整 release 构建（含签名、混淆）
# 验证通过后再打 tag，即触发 Release workflow 发布
on:
  push:
    branches: [ topway ]
  pull_request:
    branches: [ topway ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - uses: actions/checkout@v4
      # 设置jdk环境为11
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
      # 从 GitHub Actions 变量解析打包秘钥（替代上游的 pppscn/keystore 私有仓库 + TOKEN）
      - name: Decode Android Keystore
        env:
          # 配置在 Actions 的 Variables 或 Secrets 均可，两者配置其一即生效
          KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ vars.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ vars.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64，请在 Settings -> Secrets and variables -> Actions 中配置"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/topway.jks
          cat > keystore/keystore.properties <<EOF
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=../keystore/topway.jks
          storePassword=$KEYSTORE_PASSWORD
          EOF
      # 打包release
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease
