name: Release

# 触发器：push tag（如 v3.5.1.1）即构建并发布 GitHub Release
on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出代码（完整历史，用于校验 tag 是否位于 topway）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 仅允许发布 topway 分支的提交
      - name: Verify tag on topway
        run: |
          git fetch origin topway
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::仅允许对 topway 分支的提交打 tag 发布"
            exit 1
          fi
      # 设置jdk环境为11
      - name: set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '11'
          java-package: jdk
      # 从 GitHub Actions 变量解析打包秘钥（替代上游的 pppscn/keystore 私有仓库 + TOKEN）
      - name: Decode Android Keystore
        env:
          # 配置在 Actions 的 Variables 或 Secrets 均可，两者配置其一即生效
          KEYSTORE_BASE64: ${{ vars.KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ vars.KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ vars.KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secret KEYSTORE_BASE64，请在 Settings -> Secrets and variables -> Actions 中配置"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/topway.jks
          cat > keystore/keystore.properties <<EOF
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storeFile=../keystore/topway.jks
          storePassword=$KEYSTORE_PASSWORD
          EOF
      # 打包release
      - name: Build with Gradle
        run: bash ./gradlew assembleRelease
      # 创建release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: SmsForwarder ${{ github.ref_name }}
          draft: false
          prerelease: false
      # 上传至release的资源
      - name: Upload release binaries
        uses: alexellis/upload-assets@0.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./app/build/outputs/apk/release/SmsF_*"]'
